# cargo-deny: keep the product free of copyleft / source-available licences
# (research: Velociraptor AGPL, Wazuh GPL, golang-etw GPL, Elastic rules ELv2).
[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Zlib", "Unicode-3.0", "Unicode-DFS-2016", "CC0-1.0", "MPL-2.0", "CDLA-Permissive-2.0",
  "BSL-1.0", "OpenSSL", "0BSD",
  # jpeg-encoder (remote desktop frames): permissive Independent JPEG Group
  # licence; attribution in README "Third-party notices".
  "IJG",
]

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "allow"
