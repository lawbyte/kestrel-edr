[workspace]
resolver = "2"
members = ["crates/kestrel-common", "crates/kestrel-detect", "crates/kestrel-platform", "crates/kestrel-win", "crates/kestrel-scan", "crates/kestrel-msica", "crates/kestrel-agent", "crates/kestrel-server"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Azka (lawbyte)"]
rust-version = "1.96"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tokio = { version = "1", features = ["full"] }
tonic = "0.12"
prost = "0.13"

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
panic = "unwind"
