<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="432" viewBox="0 0 960 432" role="img" aria-labelledby="enrollment-title enrollment-desc" font-family="'Geist', 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
  <title id="enrollment-title">Kestrel remote-access ceiling</title>
  <desc id="enrollment-desc">The remote-access profile chosen for an enrollment token (none, unrestricted or guarded) is pinned on the agent as a ceiling the server can never raise; the effective profile is the ceiling AND the group policy, and a remote desktop or file manager request is either allowed, with a banner always shown, or refused with 403.</desc>
  <defs>
    <marker id="enrollment-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#555c6b"/></marker>
    <marker id="enrollment-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#4357c9"/></marker>
    <marker id="enrollment-arrow-ink" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#171a21"/></marker>
  </defs>
  <rect width="960" height="432" fill="#f7f8fa"/>
