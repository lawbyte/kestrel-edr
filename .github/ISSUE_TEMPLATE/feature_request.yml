name: Feature request
description: Suggest a detection, response action or console feature.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and why the current version does not cover it.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you would like Kestrel to do. For detections, describe the behaviour and the ATT&CK technique if known.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Environment, scale, compliance needs (PDPA, UU PDP, MAS TRM, OJK) or references.
