[package]
name = "kestrel-win"
description = "Windows platform layer for the Kestrel agent: ETW sensors, enrichment, response, WFP, hardening"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["yara"]
# YARA-X scanning for the `Scan` response action (Windows only; pulls in wasmtime).
yara = ["dep:yara-x"]

# Platform-independent dependencies: the pure planning / parsing / crypto
# helpers in this crate compile and are unit-tested on Linux.
[dependencies]
kestrel-common = { path = "../kestrel-common" }
kestrel-platform = { path = "../kestrel-platform" }
kestrel-detect = { path = "../kestrel-detect" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
tracing.workspace = true
async-trait = "0.1"
tokio = { version = "1", features = ["sync", "io-util", "macros", "rt", "rt-multi-thread", "time", "net"] }
sha2 = "0.10"
aes-gcm = "0.10"
getrandom = "0.2"
crc32fast = "1"
roxmltree = "0.21"

[target.'cfg(windows)'.dependencies]
ferrisetw = "1.2"
windows-service = "0.8"
yara-x = { version = "1.22", optional = true, default-features = false, features = ["pe-module", "hash-module", "math-module", "string-module", "dotnet-module", "fast-regexp", "constant-folding", "exact-atoms"] }
windows-sys = { version = "0.61", features = [
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Wdk_System_Threading",
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_NetworkManagement_WindowsFilteringPlatform",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Security_Cryptography_Catalog",
    "Win32_Security_Cryptography_Sip",
    "Win32_Security_WinTrust",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Etw",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_EventLog",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_Rpc",
    "Win32_System_Services",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_IO",
    "Win32_System_Pipes",
] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
