[package]
name = "kestrel-uninstall"
description = "Kestrel EDR uninstaller: a small native Windows dialog that removes the agent with the device's uninstall token"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[lib]
name = "kestrel_uninstall"
path = "src/lib.rs"

[[bin]]
name = "kestrel-uninstall"
path = "src/main.rs"
# All tests live in the library: the binary carries a requireAdministrator
# manifest (build.rs links it into bin targets only).
test = false

# Same windows-sys version the agent, the MSI custom actions and the tray
# already use (no new crate in the tree). The manifest, version resource and
# icon are written by build.rs without any build dependency.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_ApplicationInstallationAndServicing",
    "Win32_System_Com",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
