[package]
name = "kestrel-server"
description = "Kestrel EDR self-hosted server: REST API + console, agent gRPC (mTLS), enrollment CA, Postgres control plane, ClickHouse telemetry"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "kestrel-server"
path = "src/main.rs"

[dependencies]
kestrel-common = { path = "../kestrel-common" }
kestrel-detect = { path = "../kestrel-detect" }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
tokio.workspace = true
tonic = { workspace = true, features = ["tls"] }
prost.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
axum = { version = "0.7", features = ["macros"] }
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "trace", "set-header", "limit"] }
futures = "0.3"
async-trait = "0.1"
tokio-stream = { version = "0.1", features = ["sync"] }
async-stream = "0.3"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "json", "macros", "migrate"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem", "x509-parser"] }
x509-parser = "0.18"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"
rustls-native-certs = "0.8"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
aes-gcm = "0.10"
argon2 = "0.5"
totp-rs = { version = "5", features = ["gen_secret", "otpauth"] }
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
base64 = "0.22"
rand = "0.8"
subtle = "2"
zstd = "0.13"
dashmap = "6"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots", "http2"] }
openidconnect = { version = "4", default-features = false, features = ["reqwest", "rustls-tls"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "ring", "rustls-native-certs", "hostname"] }
yaml_serde = "0.10"
ipnet = "2"
time = "0.3"

[build-dependencies]
tonic-build = "0.12"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies"] }
tempfile = "3"
