[package]
name = "kestrel-agent"
description = "Kestrel EDR endpoint agent: transport, outbox, engine loop, tray protocol, simulator"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
build = "build.rs"

[lib]
name = "kestrel_agent"
path = "src/lib.rs"

[[bin]]
name = "kestrel-agent"
path = "src/main.rs"

[features]
default = ["win-platform"]
# Link the real Windows platform layer (kestrel-win). Disable to cross-check the
# portable core while kestrel-win is still being built.
win-platform = ["dep:kestrel-win"]

[dependencies]
kestrel-common = { path = "../kestrel-common", features = ["seal"] }
kestrel-detect = { path = "../kestrel-detect" }
kestrel-platform = { path = "../kestrel-platform" }

anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
tracing.workspace = true
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net"] }
tokio-util = { version = "0.7", features = ["codec", "rt"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
async-trait = "0.1"

tonic = { version = "0.12", features = ["tls", "zstd"] }
prost = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pemfile = "2"
hyper = { version = "1", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio"] }
# Public web PKI for update packages hosted outside the Kestrel server (the
# package itself is trusted through its Ed25519 signature + SHA-256).
webpki-roots = "1"
http-body-util = "0.1"
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem", "crypto"] }
# Certificate expiry / public-key checks for renewal (pure Rust, no verify feature).
x509-parser = { version = "0.16", default-features = false }

rusqlite = { version = "0.32", features = ["bundled"] }
zstd = { version = "0.13", default-features = false }
clap = { version = "4", features = ["derive", "env"] }
toml = "0.8"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
# Simulator test-pattern frames for remote desktop (MIT OR Apache-2.0, AND IJG notice).
jpeg-encoder = { version = "0.7.1", default-features = false, features = ["std"] }
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
argon2 = { version = "0.5", features = ["std"] }
rand = "0.8"
# tower 0.4 (via tonic) uses indexmap 1.x, whose `std` autodetection probe
# fails under `-Zbuild-std` cross builds; force it on.
indexmap1 = { package = "indexmap", version = "1", features = ["std"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"

[target.'cfg(windows)'.dependencies]
kestrel-win = { path = "../kestrel-win", optional = true }

[build-dependencies]
tonic-build = "0.12"
protoc-bin-vendored = "3"

[dev-dependencies]
tempfile = "3"
time = "0.3"
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem", "crypto", "x509-parser"] }
