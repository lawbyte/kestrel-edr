[package]
name = "kestrel-common"
description = "Shared types for Kestrel EDR: telemetry events, alerts, policy, response actions, wire messages"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
thiserror.workspace = true
# SHA-256 of evidence container entries (already in the tree).
sha2 = "0.10"
# Streaming at-rest encryption (`seal`): agent and server only.
aes-gcm = { version = "0.10", optional = true }

[features]
default = []
seal = ["dep:aes-gcm"]
